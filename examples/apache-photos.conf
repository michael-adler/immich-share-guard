# Apache front end for immich-share-guard.
#
# Apache terminates TLS for the public name and forwards everything to
# immich-share-guard over plain HTTP. immich-share-guard allows only shared-link traffic
# and forwards it to Immich.
#
# Replace these placeholders:
#   photos.example.com the public host name
#   192.168.1.20       the address immich-share-guard listens on (the Immich host)
#   certificate paths  your certificate and key
#
# Run immich-share-guard on the Immich host with Apache's address as the only
# trusted proxy, for example (with Apache's host at 192.168.1.10), in its .env:
#
#   SHARE_GUARD_UPSTREAM=http://127.0.0.1:2283
#   SHARE_GUARD_LISTEN=192.168.1.20:2284
#   SHARE_GUARD_TRUSTED_PROXIES=192.168.1.10
#
# Modules needed:
#   mod_ssl, mod_socache_shmcb (for the TLS session cache), mod_proxy,
#   mod_proxy_http, mod_headers, mod_deflate, mod_rewrite (for the redirect)
# On Debian and Ubuntu, enable them with:
#   a2enmod ssl socache_shmcb proxy proxy_http headers deflate rewrite
# Elsewhere, uncomment their LoadModule lines in httpd.conf.
#

# Send plain HTTP to HTTPS.
<VirtualHost *:80>
    ServerName photos.example.com
    RewriteEngine On
    RewriteRule ^ https://photos.example.com%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName photos.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/photos.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/photos.example.com/privkey.pem

    # Optional. Tells browsers to use HTTPS only for this name for a year.
    # Enable it once HTTPS works.
    #Header always set Strict-Transport-Security "max-age=31536000"

    # Never act as a forward proxy for arbitrary URLs. This is the default,
    # but it's dangerous enough to state.
    ProxyRequests Off

    # Pass the public host name through as Host. immich-share-guard and Immich also
    # get it from X-Forwarded-Host, which mod_proxy adds.
    ProxyPreserveHost On

    # mod_proxy adds X-Forwarded-For and X-Forwarded-Host but not the
    # protocol. Without this header Immich thinks clients use plain HTTP and
    # sets the share-password cookie without the Secure flag. "set" replaces
    # any value the client sent.
    RequestHeader set X-Forwarded-Proto "https"

    # Large zip downloads can pause while Immich reads files. This is the time
    # allowed between packets, not for the whole transfer. The default is the
    # server Timeout (60 seconds).
    ProxyTimeout 300

    # Forward everything. immich-share-guard rejects whatever isn't share traffic,
    # including the websocket, so mod_proxy_wstunnel isn't needed.
    ProxyPass        / http://192.168.1.20:2284/
    ProxyPassReverse / http://192.168.1.20:2284/

    # immich-share-guard sends JSON API responses uncompressed because it rewrites
    # them, so compress them here. mod_deflate skips responses that are
    # already compressed. Photos and videos aren't listed, so their byte
    # ranges (used for video seeking) are untouched.
    AddOutputFilterByType DEFLATE application/json text/html text/css text/javascript application/javascript image/svg+xml

    # Uploads are off unless immich-share-guard runs with
    # SHARE_GUARD_ALLOW_UPLOAD=true. If you enable them, raise Apache's body
    # limit (1 GB by default since 2.4.53).
    #LimitRequestBody 0
</VirtualHost>
